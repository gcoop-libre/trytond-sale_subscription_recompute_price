[tox]
envlist = {py310,py311,py312}-{sqlite,postgresql}

[testenv]
changedir = {env_site_packages_dir}
extras = test
commands =
    coverage run --rcfile={toxinidir}/tox.ini --source=trytond.modules.sale_subscription_recompute_price --omit=*/tests/* -m xmlrunner discover -s trytond.modules.sale_subscription_recompute_price {posargs}
commands_post =
    coverage report --rcfile={toxinidir}/tox.ini
    coverage xml --rcfile={toxinidir}/tox.ini
deps =
    coverage
    unittest-xml-reporting
    postgresql: psycopg2 >= 2.7.0
passenv = *
setenv =
    sqlite: TRYTOND_DATABASE_URI={env:SQLITE_URI:sqlite://}
    postgresql: TRYTOND_DATABASE_URI={env:POSTGRESQL_URI:postgresql://}
    sqlite: DB_NAME={env:DB_NAME::memory:}
    postgresql: DB_NAME={env:DB_NAME:test}

[coverage:run]
relative_files = true
